AWSTemplateFormatVersion: '2010-09-09'
Description: 'Furiosa Moto IoT - Infraestructura Base (Arquitectura AWS)'

# -----------------------------------------------------------------------------
# 1) Parámetros de entrada del stack
#    Estos valores permiten personalizar el nombre del proyecto, el bucket S3,
#    el Thing IoT y el correo de alertas.
# -----------------------------------------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: Furiosa
    Description: Prefijo para los recursos AWS del proyecto.

  S3BucketName:
    Type: String
    Default: furiosa-data-0454
    Description: Nombre del bucket S3 para raw/stage/modelos. 

  DeviceThingName:
    Type: String
    Default: moto_android_01
    Description: Nombre del Thing IoT para el tablero Android.

  AlertEmail:
    Type: String
    Default: admin@example.com
    Description: Email para recibir notificaciones por SNS.



# -----------------------------------------------------------------------------
# 2) Recursos de la infraestructura AWS
#    Aquí se definen todas las capas del proyecto: almacenamiento, IoT, red,
#    IAM, Lambdas y Glue.
# -----------------------------------------------------------------------------
Resources:
  # ---------------------------------------------------------------------------
  # 2.1) Capa de almacenamiento: S3 y DynamoDB
  #     Aquí se guardan los datos crudos, sesiones, predicciones, alertas y
  #     estado del dispositivo para el flujo de la moto conectada.
  # ---------------------------------------------------------------------------

  # Bucket S3 para datos crudos, stage y modelos de ML.
  FuriosaDataBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketName: !Ref S3BucketName
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Tabla de telemetría cruda: guarda cada evento recibido desde IoT Core.
  FuriosaTelemetryTableRaw:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}_Telemetry_Raw'
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Tabla de sesiones: almacena cada viaje o sesión de conducción detectada.
  FuriosaSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}_Sessions'
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Tabla de predicciones: guarda el resultado de mantenimiento/urgencia generado por ML.
  FuriosaPredictionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}_Predictions'
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Tabla de mantenimiento: almacena el estado de revisión y diagnóstico del vehículo.
  FuriosaMaintenanceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}_Maintenance'
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Tabla de alertas: persiste incidentes y anomalías detectadas por L1/L5.
  FuriosaAlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}_Alerts'
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Tabla de estado del dispositivo: mantiene el último snapshot operativo del vehículo.
  FuriosaDeviceStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}_DeviceState'
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true 
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Tabla de estado de sesión: maneja cooldowns, sesiones activas y estado transitorio.
  FuriosaSessionStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}_Session_State'
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName


  # ---------------------------------------------------------------------------
  # 2.2) Capa de IoT y notificaciones
  #     Define el Thing del dispositivo, el tópico SNS para alertas y el flujo
  #     principal de ingestión desde el broker MQTT de AWS IoT.
  # ---------------------------------------------------------------------------

  # Representa el dispositivo físico o móvil que envía datos al tópico moto/data.
  FuriosaThing:
    Type: AWS::IoT::Thing
    Properties:
      ThingName: !Ref DeviceThingName
      AttributePayload:
        Attributes:
          type: android-dashboard
          project: !Ref ProjectName

  # Tópico SNS para distribuir alertas por correo u otros canales.
  FuriosaAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-alerts'
      DisplayName: Furiosa Alerts
      Subscription:
        - Endpoint: !Ref AlertEmail
          Protocol: email

  # ---------------------------------------------------------------------------
  # 2.3) Red de infraestructura y acceso para servicios de cómputo
  #     Este VPC crea la base para invocar endpoint de SageMaker o servicios que
  #     requieren conectividad segura dentro de la nube.
  # ---------------------------------------------------------------------------

  # VPC principal del proyecto para servicios de red y ML.
  FuriosaVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  FuriosaInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  FuriosaVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref FuriosaVpc
      InternetGatewayId: !Ref FuriosaInternetGateway

  FuriosaPublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FuriosaVpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-a'

  FuriosaPublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FuriosaVpc
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-b'

  FuriosaRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FuriosaVpc
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  FuriosaRouteToInternet:
    Type: AWS::EC2::Route
    DependsOn: FuriosaVpcGatewayAttachment
    Properties:
      RouteTableId: !Ref FuriosaRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref FuriosaInternetGateway

  FuriosaPublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref FuriosaPublicSubnetA
      RouteTableId: !Ref FuriosaRouteTable

  FuriosaPublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref FuriosaPublicSubnetB
      RouteTableId: !Ref FuriosaRouteTable

  FuriosaSageMakerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for SageMaker endpoints
      VpcId: !Ref FuriosaVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Log group para errores de IoT Core y trazas del pipeline.
  IoTErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/iot/furiosa-errors
      RetentionInDays: 30

  # Rol de IoT para permisos de escritura a DynamoDB, CloudWatch Logs y Lambda.
  IoTRuleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-iot-rule-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FuriosaIoTRulePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
            
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - !GetAtt FuriosaTelemetryTableRaw.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/iot/furiosa-errors:*'
                
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt L1RealtimeMonitorFunction.Arn
                  - !GetAtt L2SessionDetectorFunction.Arn

  # Regla IoT principal: escucha 'moto/data' y dispara los pasos de ingestión.
  FuriosaDataRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: Furiosa_Data_Rule
      TopicRulePayload:
        Sql: SELECT * FROM 'moto/data'
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Actions:
          - DynamoDB:
              TableName: !Ref FuriosaTelemetryTableRaw
              HashKeyField: device_id
              HashKeyValue: '${device_id}'
              RangeKeyField: timestamp
              RangeKeyValue: '${timestamp()}'
              RoleArn: !GetAtt IoTRuleRole.Arn
          - Lambda:
              FunctionArn: !GetAtt L1RealtimeMonitorFunction.Arn
          - Lambda:
              FunctionArn: !GetAtt L2SessionDetectorFunction.Arn

  # ---------------------------------------------------------------------------
  # 2.4) IAM y permisos de ejecución
  #     Define los accesos mínimos necesarios para Lambdas, Glue y reglas IoT.
  # ---------------------------------------------------------------------------

  # Rol compartido para todas las Lambdas del pipeline.
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: FuriosaLambdaAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt FuriosaAlertsTable.Arn
                  - !GetAtt FuriosaDeviceStateTable.Arn
                  - !GetAtt FuriosaSessionStateTable.Arn
                  - !GetAtt FuriosaSessionsTable.Arn
                  - !GetAtt FuriosaPredictionsTable.Arn
                  - !GetAtt FuriosaMaintenanceTable.Arn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref FuriosaAlertsTopic
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*'
              - Effect: Allow
                Action:
                  - sagemaker:InvokeEndpoint
                Resource: '*'

              - Effect: Allow
                Action:
                  - glue:StartJobRun
                  - glue:GetJobRun
                Resource: !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:job/${ProjectName}-G1-raw-to-stage'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${S3BucketName}'
                  - !Sub 'arn:aws:s3:::${S3BucketName}/*'
  # ---------------------------------------------------------------------------
  # 2.5) Capa de cómputo: Lambdas del pipeline
  #     Cada función se encarga de una etapa del procesamiento:
  #     L1 -> monitor / alertas, L2 -> sesiones, L3 -> mantenimiento, L4 -> voz,
  #     L5 -> despacho final a SNS.
  # ---------------------------------------------------------------------------

  # Lambda L1: monitor en tiempo real y detección de anomalías.
  L1RealtimeMonitorFunction:
    Type: AWS::Lambda::Function
    Metadata:
      SourceFile: aws-cloud/lambda/L1_realtime_monitor.py
    Properties:
      FunctionName: L1_realtime_monitor
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          ALERTS_TABLE: !Ref FuriosaAlertsTable
          ALERTS_TOPIC_ARN: !Ref FuriosaAlertsTopic
          ALERT_DISPATCHER_FUNCTION: !Ref L5AlertDispatcherFunction
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "placeholder - pendiente despliegue CI/CD"}

  # Lambda L2: detecta sesión activa y cierra la sesión con métricas relevantes.
  L2SessionDetectorFunction:
    Type: AWS::Lambda::Function
    Metadata:
      SourceFile: aws-cloud/lambda/L2_session_detector.py
    Properties:
      FunctionName: L2_session_detector
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          SESSION_STATE_TABLE: !Ref FuriosaSessionStateTable
          SESSIONS_TABLE: !Ref FuriosaSessionsTable
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "placeholder - pendiente despliegue CI/CD"}

  # Lambda L3: invoca el endpoint de SageMaker para predecir mantenimiento.
  L3MaintenancePredictFunction:
    Type: AWS::Lambda::Function
    Metadata:
      SourceFile: aws-cloud/lambda/L3_maintenance_predict.py
    Properties:
      FunctionName: L3_maintenance_predict
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          PREDICTIONS_TABLE: !Ref FuriosaPredictionsTable
          MAINTENANCE_TABLE: !Ref FuriosaMaintenanceTable
          ALERTS_TOPIC_ARN: !Ref FuriosaAlertsTopic
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "placeholder - pendiente despliegue CI/CD"}

  # Lambda L4: interpreta comandos por voz usando Bedrock y contexto del vehículo.
  L4VoiceCommandHandlerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: L4_voice_command_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          ALERTS_TABLE: !Ref FuriosaAlertsTable
          ALERTS_TOPIC_ARN: !Ref FuriosaAlertsTopic
          SESSIONS_TABLE: !Ref FuriosaSessionsTable
          MAINTENANCE_TABLE: !Ref FuriosaMaintenanceTable
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "placeholder L4"}

  # Lambda L5: formatea la alerta y la publica en el tema SNS principal.
  L5AlertDispatcherFunction:
    Type: AWS::Lambda::Function
    Metadata:
      SourceFile: aws-cloud/lambda/L5_alert_dispatcher.py
    Properties:
      FunctionName: L5_alert_dispatcher
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          ALERTS_TABLE: !Ref FuriosaAlertsTable
          ALERTS_TOPIC_ARN: !Ref FuriosaAlertsTopic
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "placeholder - pendiente despliegue CI/CD"}

  # Permisos de invocación para que IoT Core pueda disparar las funciones Lambda.
  L1InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref L1RealtimeMonitorFunction
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rule/*'

  L2InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref L2SessionDetectorFunction
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rule/*'
      
  L4InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref L4VoiceCommandHandlerFunction
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rule/*'

  
  # ---------------------------------------------------------------------------
  # 2.6) Glue ETL
  #     Procesa los datos de sesión para exportar CSV/JSON y disparar la etapa
  #     de mantenimiento (L3) al cerrar la sesión.
  # ---------------------------------------------------------------------------

  # Rol de Glue con permisos para leer DynamoDB, exportar a S3 y ejecutar L3.
  GlueExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-glue-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: FuriosaGluePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:ListBucket]
                Resource:
                  - !Sub 'arn:aws:s3:::${S3BucketName}'
                  - !Sub 'arn:aws:s3:::${S3BucketName}/*'
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt FuriosaTelemetryTableRaw.Arn
                  - !GetAtt FuriosaSessionsTable.Arn
                  - !GetAtt FuriosaSessionStateTable.Arn
                  - !GetAtt FuriosaMaintenanceTable.Arn
              - Effect: Allow
                Action: [lambda:InvokeFunction]
                Resource: !GetAtt L3MaintenancePredictFunction.Arn

  # Job G1: toma datos crudos y los prepara para stage + export a S3.
  G1RawToStageJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub '${ProjectName}-G1-raw-to-stage'
      Role: !GetAtt GlueExecutionRole.Arn
      Description: >
        Lee registros raw de DynamoDB al fin de sesión,
        calcula métricas de stage, exporta CSV a S3 raw/sessions/
        y JSON a S3 stage/sessions/, luego invoca L3.
      GlueVersion: '3.0'
      Command:
        Name: pythonshell
        ScriptLocation: !Sub 's3://${S3BucketName}/glue-scripts/raw_to_stage.py'
        PythonVersion: '3'
      DefaultArguments:
        '--job-language': python
        '--bucket': !Ref S3BucketName
        '--session_id': 'PLACEHOLDER'
        '--device_id': 'PLACEHOLDER'
        '--start_ts': '0'
        '--end_ts': '0'
        '--l3_function': !Ref L3MaintenancePredictFunction
        '--enable-job-insights': 'false'
      MaxCapacity: 0.0625
      Timeout: 30
      Tags:
        Project: !Ref ProjectName





# -----------------------------------------------------------------------------
# 3) Outputs del stack
#    Exponen los identificadores importantes para uso externo.
# -----------------------------------------------------------------------------
Outputs:
  BucketName:
    Description: Bucket principal de Furiosa.
    Value: !Ref FuriosaDataBucket

  TelemetryTableName:
    Description: Tabla de telemetr?a en DynamoDB.
    Value: !Ref FuriosaTelemetryTableRaw

  SessionTableName:
    Description: Tabla de sesiones.
    Value: !Ref FuriosaSessionsTable

  AlertsTopicArn:
    Description: SNS Topic para alertas de moto.
    Value: !Ref FuriosaAlertsTopic

  IoTThingName:
    Description: Thing IoT asociado al Android.
    Value: !Ref FuriosaThing

  DataRuleName:
    Description: Regla IoT para ingestion.
    Value: !Ref FuriosaDataRule
    
  GlueRoleArn:
    Description: ARN del role de Glue
    Value: !GetAtt GlueExecutionRole.Arn


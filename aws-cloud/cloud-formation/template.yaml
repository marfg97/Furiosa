AWSTemplateFormatVersion: '2010-09-09'
Description: 'Furiosa Moto IoT - Infraestructura Base (Arquitectura AWS)'

Parameters:
  ProjectName:
    Type: String
    Default: Furiosa
    Description: Prefijo para los recursos AWS del proyecto.

  S3BucketName:
    Type: String
    Default: furiosa-data
    Description: Nombre del bucket S3 para raw/stage/modelos. Debe ser globalmente único.

  DeviceThingName:
    Type: String
    Default: moto_android_01
    Description: Nombre del Thing IoT para el tablero Android.

  AlertEmail:
    Type: String
    Default: admin@example.com
    Description: Email para recibir notificaciones por SNS.

Resources:
  # --- CAPA DE ALMACENAMIENTO (S3 y DynamoDB) ---
  
  # Bucket S3 para datos crudos, stage y ML
  FuriosaDataBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketName: !Ref S3BucketName
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  FuriosaTelemetryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}_Telemetry'
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  FuriosaSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}_Sessions'
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  FuriosaPredictionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}_Predictions'
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  FuriosaMaintenanceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}_Maintenance'
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  FuriosaAlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}_Alerts'
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  FuriosaDeviceStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}_DeviceState'
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  FuriosaSessionStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}_Session_State'
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: !Ref ProjectName


 # --- CAPA DE IoT INGESTA  ---
  
  FuriosaThing:
    Type: AWS::IoT::Thing
    Properties:
      ThingName: !Ref DeviceThingName
      AttributePayload:
        Attributes:
          type: android-dashboard
          project: !Ref ProjectName

  FuriosaAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-alerts'
      DisplayName: Furiosa Alerts
      Subscription:
        - Endpoint: !Ref AlertEmail
          Protocol: email

  IoTErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/iot/furiosa-errors
      RetentionInDays: 30

  IoTRuleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-iot-rule-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FuriosaIoTRulePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetBucketLocation
                Resource:
                  - !Sub '${FuriosaDataBucket.Arn}'
                  - !Sub '${FuriosaDataBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - !GetAtt FuriosaTelemetryTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/iot/furiosa-errors:*'

  FuriosaDataRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: Furiosa_Data_Rule
      TopicRulePayload:
        Sql: SELECT * FROM 'moto/data'
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Actions:
          - S3:
              BucketName: !Ref FuriosaDataBucket
              Key: raw/year=${year}/month=${month}/day=${day}/${timestamp()}.json
              RoleArn: !GetAtt IoTRuleRole.Arn
          - DynamoDB:
              TableName: !Ref FuriosaTelemetryTable
              HashKeyField: device_id
              HashKeyValue: '${device_id}'
              RangeKeyField: timestamp
              RangeKeyValue: '${timestamp()}'
              RoleArn: !GetAtt IoTRuleRole.Arn
          - Lambda:
              FunctionArn: !GetAtt L1RealtimeMonitorFunction.Arn
          - Lambda:
              FunctionArn: !GetAtt L2SessionDetectorFunction.Arn

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: FuriosaLambdaAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt FuriosaAlertsTable.Arn
                  - !GetAtt FuriosaDeviceStateTable.Arn
                  - !GetAtt FuriosaSessionStateTable.Arn
                  - !GetAtt FuriosaSessionsTable.Arn
                  - !GetAtt FuriosaPredictionsTable.Arn
                  - !GetAtt FuriosaMaintenanceTable.Arn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref FuriosaAlertsTopic
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt L1RealtimeMonitorFunction.Arn
                  - !GetAtt L2SessionDetectorFunction.Arn
                  - !GetAtt L5AlertDispatcherFunction.Arn
              - Effect: Allow
                Action:
                  - sagemaker:InvokeEndpoint
                Resource: '*'

  L1RealtimeMonitorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-realtime-monitor'
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          ALERTS_TABLE: !Ref FuriosaAlertsTable
          ALERTS_TOPIC_ARN: !Ref FuriosaAlertsTopic
          ALERT_DISPATCHER_FUNCTION: !Ref L5AlertDispatcherFunction
      Code:
        ZipFile: |
          import json
          import os
          import time
          import boto3

          dynamodb = boto3.resource('dynamodb', region_name=os.environ.get('AWS_REGION', 'us-east-1'))
          lambda_client = boto3.client('lambda', region_name=os.environ.get('AWS_REGION', 'us-east-1'))
          alerts_table = dynamodb.Table(os.environ['ALERTS_TABLE'])

          THRESHOLDS = {
              'engine_temp_c': {'warn': 90, 'critical': 95},
              'rpm': {'warn': 7000, 'critical': 8000},
              'voltage_bike': {'warn': 12.0, 'critical': 11.5, 'mode': 'below'},
              'battery_cel_percent': {'warn': 20, 'critical': 10, 'mode': 'below'},
              'tire_pressure_front_psi': {'warn': 28, 'critical': 25, 'mode': 'below'},
              'tire_pressure_rear_psi': {'warn': 30, 'critical': 27, 'mode': 'below'},
          }

          def evaluate_metric(metric, value):
              if value is None:
                  return None
              cfg = THRESHOLDS.get(metric)
              if not cfg:
                  return None
              mode = cfg.get('mode', 'above')
              if mode == 'above':
                  if value >= cfg.get('critical'):
                      return 'critical'
                  if value >= cfg.get('warn'):
                      return 'warn'
              else:
                  if value <= cfg.get('critical'):
                      return 'critical'
                  if value <= cfg.get('warn'):
                      return 'warn'
              return None

          def lambda_handler(event, context):
              device_id = event.get('device_id', 'furiosa_01')
              alerts = []
              for metric in THRESHOLDS:
                  level = evaluate_metric(metric, event.get(metric))
                  if level:
                      msg = {
                          'metric': metric,
                          'value': event.get(metric),
                          'level': level,
                          'message': f'{metric} fuera de rango: {event.get(metric)}'
                      }
                      alerts.append(msg)
                      alerts_table.put_item(Item={
                          'device_id': device_id,
                          'timestamp': str(int(time.time())),
                          'metric': metric,
                          'value': str(event.get(metric)),
                          'level': level,
                          'message': msg['message'],
                          'created_at': str(int(time.time()))
                      })
                      lambda_client.invoke(
                          FunctionName=os.environ['ALERT_DISPATCHER_FUNCTION'],
                          InvocationType='Event',
                          Payload=json.dumps({'device_id': device_id, 'alert': msg, 'mode': 'riding'}).encode('utf-8')
                      )
              return {'statusCode': 200, 'alerts': alerts}

  L2SessionDetectorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-session-detector'
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          SESSION_STATE_TABLE: !Ref FuriosaSessionStateTable
          SESSIONS_TABLE: !Ref FuriosaSessionsTable
          GLUE_JOB_NAME: G1-raw-to-stage
      Code:
        ZipFile: |
          import os
          import time
          from datetime import datetime
          import boto3

          dynamodb = boto3.resource('dynamodb', region_name=os.environ.get('AWS_REGION', 'us-east-1'))
          glue = boto3.client('glue', region_name=os.environ.get('AWS_REGION', 'us-east-1'))
          session_state_table = dynamodb.Table(os.environ['SESSION_STATE_TABLE'])
          sessions_table = dynamodb.Table(os.environ['SESSIONS_TABLE'])

          def lambda_handler(event, context):
              device_id = event.get('device_id', 'furiosa_01')
              engine_on = bool(event.get('engine_on', False))
              now = int(time.time())

              item = session_state_table.get_item(Key={'device_id': device_id}).get('Item')
              if not item or item.get('active') != 'true':
                  if engine_on:
                      session_id = f"{device_id}_{datetime.utcnow().strftime('%Y%m%d')}_{int(time.time()) % 10000}"
                      session_state_table.put_item(Item={
                          'device_id': device_id,
                          'active': 'true',
                          'session_id': session_id,
                          'session_start_ts': str(now),
                          'last_seen_ts': str(now),
                          'distance_km_accum': '0',
                          'last_updated': str(now)
                      })
                  return {'statusCode': 200, 'action': 'seeded'}

              last_seen = int(item.get('last_seen_ts', now))
              if not engine_on or (now - last_seen) > 120:
                  session_id = item['session_id']
                  sessions_table.put_item(Item={
                      'session_id': session_id,
                      'device_id': device_id,
                      'timestamp': str(now),
                      'status': 'closed',
                      'session_start_ts': item['session_start_ts'],
                      'session_end_ts': str(now),
                      'distance_km': item.get('distance_km_accum', '0'),
                      'glue_triggered': 'false'
                  })
                  try:
                      glue.start_job_run(
                          JobName=os.environ['GLUE_JOB_NAME'],
                          Arguments={
                              '--session_id': session_id,
                              '--device_id': device_id,
                              '--start_ts': item['session_start_ts'],
                              '--end_ts': str(now),
                              '--bucket': 'furiosa-data'
                          }
                      )
                  except Exception as exc:
                      print(f'Glue trigger failure: {exc}')
                  session_state_table.put_item(Item={'device_id': device_id, 'active': 'false', 'session_id': 'none'})
                  return {'statusCode': 200, 'action': 'session_closed'}

              session_state_table.update_item(
                  Key={'device_id': device_id},
                  UpdateExpression='SET last_seen_ts = :ts, last_updated = :ts',
                  ExpressionAttributeValues={':ts': str(now)}
              )
              return {'statusCode': 200, 'action': 'session_updated'}

  L3MaintenancePredictFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-maintenance-predict'
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          PREDICTIONS_TABLE: !Ref FuriosaPredictionsTable
          MAINTENANCE_TABLE: !Ref FuriosaMaintenanceTable
          ALERTS_TOPIC_ARN: !Ref FuriosaAlertsTopic
      Code:
        ZipFile: |
          import json
          import os
          import time
          import boto3

          dynamodb = boto3.resource('dynamodb', region_name=os.environ.get('AWS_REGION', 'us-east-1'))
          sm = boto3.client('sagemaker-runtime', region_name=os.environ.get('AWS_REGION', 'us-east-1'))
          predictions_table = dynamodb.Table(os.environ['PREDICTIONS_TABLE'])
          maintenance_table = dynamodb.Table(os.environ['MAINTENANCE_TABLE'])

          ENDPOINTS = ['furiosa-maintenance-oil', 'furiosa-maintenance-brake-front']

          def lambda_handler(event, context):
              session_id = event.get('session_id')
              if not session_id:
                  return {'statusCode': 400, 'error': 'session_id requerido'}

              feature_vector = [
                  float(event.get('distance_km', 0)),
                  float(event.get('duration_min', 0)),
                  float(event.get('speed_avg_kmh', 0)),
                  float(event.get('rpm_avg', 0)),
                  float(event.get('engine_temp_max_c', 0)),
                  float(event.get('oil_temp_max_c', 0))
              ]
              payload = ','.join(str(v) for v in feature_vector)
              predictions = {}
              for endpoint in ENDPOINTS:
                  try:
                      response = sm.invoke_endpoint(EndpointName=endpoint, ContentType='text/csv', Body=payload)
                      score = float(response['Body'].read().decode('utf-8').strip())
                      predictions[endpoint] = score
                  except Exception:
                      predictions[endpoint] = -1
              predictions_table.put_item(Item={
                  'session_id': session_id,
                  'device_id': event.get('device_id', 'furiosa_01'),
                  'timestamp': str(int(time.time())),
                  'predictions': json.dumps(predictions),
                  'status': 'ready'
              })
              maintenance_table.put_item(Item={
                  'device_id': event.get('device_id', 'furiosa_01'),
                  'timestamp': str(int(time.time())),
                  'oil_km_left': str(predictions.get(ENDPOINTS[0], -1)),
                  'brake_front_km_left': str(predictions.get(ENDPOINTS[1], -1))
              })
              return {'statusCode': 200, 'session_id': session_id, 'predictions': predictions}

  L5AlertDispatcherFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-alert-dispatcher'
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          ALERTS_TABLE: !Ref FuriosaAlertsTable
          ALERTS_TOPIC_ARN: !Ref FuriosaAlertsTopic
      Code:
        ZipFile: |
          import json
          import os
          import time
          import boto3

          sns = boto3.client('sns', region_name=os.environ.get('AWS_REGION', 'us-east-1'))
          dynamodb = boto3.resource('dynamodb', region_name=os.environ.get('AWS_REGION', 'us-east-1'))
          alerts_table = dynamodb.Table(os.environ['ALERTS_TABLE'])

          def lambda_handler(event, context):
              device_id = event.get('device_id', 'furiosa_01')
              alert = event.get('alert', {})
              mode = event.get('mode', 'riding')
              message = alert.get('message', str(alert))
              level = alert.get('level', 'warn')
              metric = alert.get('metric', 'unknown')

              sns.publish(
                  TopicArn=os.environ['ALERTS_TOPIC_ARN'],
                  Subject=f'Furiosa alert [{level.upper()}]',
                  Message=message,
                  MessageAttributes={
                      'device_id': {'DataType': 'String', 'StringValue': device_id},
                      'level': {'DataType': 'String', 'StringValue': level},
                      'metric': {'DataType': 'String', 'StringValue': metric},
                  }
              )

              alerts_table.put_item(Item={
                  'device_id': device_id,
                  'timestamp': str(int(time.time())),
                  'metric': metric,
                  'level': level,
                  'message': message,
                  'mode': mode
              })
              return {'statusCode': 200, 'message': message, 'mode': mode}

  L1InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref L1RealtimeMonitorFunction
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt FuriosaDataRule.Arn

  L2InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref L2SessionDetectorFunction
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt FuriosaDataRule.Arn

  GlueServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-glue-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: FuriosaGlueS3AndLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub '${FuriosaDataBucket.Arn}'
                  - !Sub '${FuriosaDataBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt FuriosaTelemetryTable.Arn
                  - !GetAtt FuriosaSessionsTable.Arn
                  - !GetAtt FuriosaPredictionsTable.Arn
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt L3MaintenancePredictFunction.Arn

  GlueJobRawToStage:
    Type: AWS::Glue::Job
    Properties:
      Name: G1-raw-to-stage
      Role: !GetAtt GlueServiceRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${S3BucketName}/scripts/raw_2_stage.py'
      GlueVersion: '3.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      MaxRetries: 1
      Timeout: 120
      Tags:
        Project: !Ref ProjectName

Outputs:
  BucketName:
    Description: Bucket principal de Furiosa.
    Value: !Ref FuriosaDataBucket

  TelemetryTableName:
    Description: Tabla de telemetría en DynamoDB.
    Value: !Ref FuriosaTelemetryTable

  SessionTableName:
    Description: Tabla de sesiones.
    Value: !Ref FuriosaSessionsTable

  AlertsTopicArn:
    Description: SNS Topic para alertas de moto.
    Value: !Ref FuriosaAlertsTopic

  IoTThingName:
    Description: Thing IoT asociado al Android.
    Value: !Ref FuriosaThing

  DataRuleName:
    Description: Regla IoT para ingestion.
    Value: !Ref FuriosaDataRule

  GlueJobName:
    Description: Job Glue para transformar raw a stage.
    Value: !Ref GlueJobRawToStage
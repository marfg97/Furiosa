AWSTemplateFormatVersion: '2010-09-09'
Description: 'Furiosa Moto IoT - Infraestructura Base (Arquitectura AWS)'

# Plantilla principal de infraestructura para el entorno de stage.
# Organiza los recursos por capas funcionales para facilitar lectura, mantenimiento y despliegue

Parameters:
  ProjectName:
    Type: String
    Default: Furiosa
    Description: Prefijo para los recursos AWS del proyecto.

  S3BucketName:
    Type: String
    Default: furiosa-data-0454
    Description: Nombre del bucket S3 para raw/stage/modelos. 

  CreateSageMakerResources:
    Type: String
    AllowedValues: [true, false]
    Default: false
    Description: 'Si se establece en true, la plantilla creará los modelos y endpoints de SageMaker. Usar true sólo cuando los artefactos de modelo estén en S3.'

  DeviceThingName:
    Type: String
    Default: moto_android_01
    Description: Nombre del Thing IoT para el tablero Android.

  AlertEmail:
    Type: String
    Default: admin@example.com
    Description: Email para recibir notificaciones por SNS.

Conditions:
  CreateSageMakerResourcesCondition: !Equals [ !Ref CreateSageMakerResources, 'true' ]

Resources:
  # =========================================================
  # CAPA 1: ALMACENAMIENTO Y PERSISTENCIA
  # - S3 para datos crudos, stage y artefactos ML
  # - DynamoDB para telemetría, sesiones, alertas y estado
  # =========================================================
  
  # Bucket S3 para datos crudos, stage y ML
  FuriosaDataBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketName: !Ref S3BucketName
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: !Ref ProjectName
  # --- CAPA DE BASE DE DATOS (DynamoDB) ---

  # Telemetría principal del vehículo: guarda cada lectura del dispositivo
  # (velocidad, temperatura, vibración, sensores, estado operacional, etc.).
  # Sirve como histórico de tiempo real para dashboards, validación de eventos,
  # auditoría y análisis de comportamiento del vehículo.
  FuriosaTelemetryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}_Telemetry'
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Registro de sesiones operativas: identifica cada ciclo de uso o viaje.
  # Sirve para agrupar telemetría por sesión, medir duración, correlacionar
  # eventos, y asociar predicciones o alertas con un mismo recorrido/uso.
  FuriosaSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}_Sessions'
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: !Ref ProjectName


  # Resultados del modelo de mantenimiento predictivo.
  # Almacena las predicciones para componentes como aceite, frenos, cadena,
  # neumáticos y urgencia de servicio. Sirve para priorizar mantenimientos y
  # mostrar recomendaciones dentro del dashboard/alertas del sistema.
  FuriosaPredictionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}_Predictions'
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Historial de mantenimiento del vehículo.
  # Guarda eventos, tareas, intervenciones y estado del equipo en cada punto
  # de servicio. Sirve para rastrear qué se reparó, cuándo y qué recomendación
  # fue asumida o descartada.
  FuriosaMaintenanceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}_Maintenance'
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Registro de alertas operativas del sistema.
  # Se usa para guardar eventos críticos o importantes generados por el
  # monitoreo en tiempo real, facilitando la trazabilidad, análisis e historial
  # de incidentes y notificaciones a usuarios o equipos.
  FuriosaAlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}_Alerts'
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Estado actual del dispositivo o moto.
  # Guarda el último valor conocido de cada condición crítica para permitir
  # consultas rápidas por parte de Lambdas y dashboards. Sirve como caché del
  # estado vivo del hardware y facilita la lógica de monitoreo operativo.
  FuriosaDeviceStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}_DeviceState'
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Estado en vivo de la sesión activa.
  # Mantiene el seguimiento del progreso y del estado actual de un viaje o
  # sesión en ejecución. Se usa para conocer si una sesión está activa,
  # pausada, finalizada o requiere intervención en tiempo real.
  FuriosaSessionStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}_Session_State'
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: !Ref ProjectName


  # =========================================================
  # CAPA 2: IoT Y EVENTOS
  # - Thing virtual del dashboard Android
  # - Topic de alertas SNS
  # - Regla de ingestión desde MQTT hacia S3/DynamoDB/Lambda
  # =========================================================

  # Representa el dispositivo o panel de Android conectado a Furiosa.
  FuriosaThing:
    Type: AWS::IoT::Thing
    Properties:
      ThingName: !Ref DeviceThingName
      AttributePayload:
        Attributes:
          type: android-dashboard
          project: !Ref ProjectName

  # Canal de notificación para alertas generadas por el pipeline de monitoreo.
  FuriosaAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-alerts'
      DisplayName: Furiosa Alerts
      Subscription:
        - Endpoint: !Ref AlertEmail
          Protocol: email
  # =========================================================
  # CAPA 3: RED Y SEGURIDAD
  # - VPC pública con subredes para recursos de cómputo y SageMaker
  # - Gateway Internet para acceso exterior y conectividad de servicios
  # =========================================================
  FuriosaVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  FuriosaInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  FuriosaVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref FuriosaVpc
      InternetGatewayId: !Ref FuriosaInternetGateway

  FuriosaPublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FuriosaVpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-a'

  FuriosaPublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FuriosaVpc
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-b'

  FuriosaRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FuriosaVpc
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  FuriosaRouteToInternet:
    Type: AWS::EC2::Route
    DependsOn: FuriosaVpcGatewayAttachment
    Properties:
      RouteTableId: !Ref FuriosaRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref FuriosaInternetGateway

  FuriosaPublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref FuriosaPublicSubnetA
      RouteTableId: !Ref FuriosaRouteTable

  FuriosaPublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref FuriosaPublicSubnetB
      RouteTableId: !Ref FuriosaRouteTable

  FuriosaSageMakerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for SageMaker endpoints
      VpcId: !Ref FuriosaVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # =========================================================
  # CAPA 4: LOGS E IAM
  # - Logs de errores de IoT
  # - Roles para la regla de ingestión y para Lambdas
  # =========================================================
  IoTErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/iot/furiosa-errors
      RetentionInDays: 30

  # Rol de ejecución de la regla IoT: permite escribir a S3, DynamoDB y CloudWatch.
  IoTRuleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-iot-rule-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FuriosaIoTRulePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetBucketLocation
                Resource:
                  - !Sub '${FuriosaDataBucket.Arn}'
                  - !Sub '${FuriosaDataBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - !GetAtt FuriosaTelemetryTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/iot/furiosa-errors:*'


  
  # Regla IoT central: recibe mensajes del tópico 'moto/data' y los enruta
  # a almacenamiento, base de datos y procesamiento en Lambda.
  FuriosaDataRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: Furiosa_Data_Rule
      TopicRulePayload:
        Sql: SELECT * FROM 'moto/data'
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Actions:
          - S3:
              BucketName: !Ref FuriosaDataBucket
              Key: raw/year=${year}/month=${month}/day=${day}/${timestamp()}.json
              RoleArn: !GetAtt IoTRuleRole.Arn
          - DynamoDB:
              TableName: !Ref FuriosaTelemetryTable
              HashKeyField: device_id
              HashKeyValue: '${device_id}'
              RangeKeyField: timestamp
              RangeKeyValue: '${timestamp()}'
              RoleArn: !GetAtt IoTRuleRole.Arn
          - Lambda:
              FunctionArn: !GetAtt L1RealtimeMonitorFunction.Arn
          - Lambda:
              FunctionArn: !GetAtt L2SessionDetectorFunction.Arn

  # Rol compartido por todas las funciones Lambda del pipeline de Furiosa.
  # Centraliza permisos para DynamoDB, SNS, Lambda y SageMaker.
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: FuriosaLambdaAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt FuriosaAlertsTable.Arn
                  - !GetAtt FuriosaDeviceStateTable.Arn
                  - !GetAtt FuriosaSessionStateTable.Arn
                  - !GetAtt FuriosaSessionsTable.Arn
                  - !GetAtt FuriosaPredictionsTable.Arn
                  - !GetAtt FuriosaMaintenanceTable.Arn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref FuriosaAlertsTopic
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*'
              - Effect: Allow
                Action:
                  - sagemaker:InvokeEndpoint
                Resource: '*'
  # =========================================================
  # CAPA 5: COMPUTO (Lambdas)
  # Cada una representa un nivel del pipeline de analítica y automatización.
  # Las funciones quedan definidas con payload placeholder y se despliegan
  # en CI/CD cuando el código real ya está listo.
  # =========================================================

  # L1 - monitor en tiempo real: detecta anomalías de telemetría operativa.
  L1RealtimeMonitorFunction:
    Type: AWS::Lambda::Function
    Metadata:
      SourceFile: aws-cloud/lambda/L1_realtime_monitor.py
    Properties:
      FunctionName: L1_realtime_monitor
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          ALERTS_TABLE: !Ref FuriosaAlertsTable
          ALERTS_TOPIC_ARN: !Ref FuriosaAlertsTopic
          ALERT_DISPATCHER_FUNCTION: !Ref L5AlertDispatcherFunction
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "placeholder - pendiente despliegue CI/CD"}

  # L2 - detector de sesión: identifica ventanas operativas y correlaciones.
  L2SessionDetectorFunction:
    Type: AWS::Lambda::Function
    Metadata:
      SourceFile: aws-cloud/lambda/L2_session_detector.py
    Properties:
      FunctionName: L2_session_detector
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          SESSION_STATE_TABLE: !Ref FuriosaSessionStateTable
          SESSIONS_TABLE: !Ref FuriosaSessionsTable
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "placeholder - pendiente despliegue CI/CD"}

  # L3 - predicción de mantenimiento: consume modelos y genera recomendaciones.
  L3MaintenancePredictFunction:
    Type: AWS::Lambda::Function
    Metadata:
      SourceFile: aws-cloud/lambda/L3_maintenance_predict.py
    Properties:
      FunctionName: L3_maintenance_predict
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          PREDICTIONS_TABLE: !Ref FuriosaPredictionsTable
          MAINTENANCE_TABLE: !Ref FuriosaMaintenanceTable
          ALERTS_TOPIC_ARN: !Ref FuriosaAlertsTopic
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "placeholder - pendiente despliegue CI/CD"}

  # L4 - manejo de comandos por voz: procesa eventos de control/comandos.
  L4VoiceCommandHandlerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: L4_voice_command_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          ALERTS_TABLE: !Ref FuriosaAlertsTable
          ALERTS_TOPIC_ARN: !Ref FuriosaAlertsTopic
          SESSIONS_TABLE: !Ref FuriosaSessionsTable
          MAINTENANCE_TABLE: !Ref FuriosaMaintenanceTable
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "placeholder L4"}

  # L5 - despachador de alertas: centraliza la publicación y el enrutamiento.
  L5AlertDispatcherFunction:
    Type: AWS::Lambda::Function
    Metadata:
      SourceFile: aws-cloud/lambda/L5_alert_dispatcher.py
    Properties:
      FunctionName: L5_alert_dispatcher
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          ALERTS_TABLE: !Ref FuriosaAlertsTable
          ALERTS_TOPIC_ARN: !Ref FuriosaAlertsTopic
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "placeholder - pendiente despliegue CI/CD"}

  L1InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref L1RealtimeMonitorFunction
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rule/*'

  L2InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref L2SessionDetectorFunction
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rule/*'
      
  L4InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref L4VoiceCommandHandlerFunction
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rule/*'

  # =========================================================
  # CAPA 6: ML / SageMaker (opcional)
  # Solo se crea si el parámetro CreateSageMakerResources se activa.
  # =========================================================
  FuriosaSageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  FuriosaMaintenanceModelOil:
    Condition: CreateSageMakerResourcesCondition
    Type: AWS::SageMaker::Model
    Properties:
      ModelName: furiosa-maintenance-oil
      ExecutionRoleArn: !GetAtt FuriosaSageMakerExecutionRole.Arn
      PrimaryContainer:
        Image: !Sub '683313688378.dkr.ecr.${AWS::Region}.amazonaws.com/sagemaker-xgboost:1-0-1'
        ModelDataUrl: !Sub 's3://${S3BucketName}/ml/models/placeholder/oil-model.tar.gz'
      VpcConfig:
        Subnets:
          - !Ref FuriosaPublicSubnetA
          - !Ref FuriosaPublicSubnetB
        SecurityGroupIds:
          - !Ref FuriosaSageMakerSecurityGroup

  FuriosaMaintenanceModelBrakeFront:
    Condition: CreateSageMakerResourcesCondition
    Type: AWS::SageMaker::Model
    Properties:
      ModelName: furiosa-maintenance-brake-front
      ExecutionRoleArn: !GetAtt FuriosaSageMakerExecutionRole.Arn
      PrimaryContainer:
        Image: !Sub '683313688378.dkr.ecr.${AWS::Region}.amazonaws.com/sagemaker-xgboost:1-0-1'
        ModelDataUrl: !Sub 's3://${S3BucketName}/ml/models/placeholder/brake-front-model.tar.gz'
      VpcConfig:
        Subnets:
          - !Ref FuriosaPublicSubnetA
          - !Ref FuriosaPublicSubnetB
        SecurityGroupIds:
          - !Ref FuriosaSageMakerSecurityGroup

  FuriosaMaintenanceModelBrakeRear:
    Condition: CreateSageMakerResourcesCondition
    Type: AWS::SageMaker::Model
    Properties:
      ModelName: furiosa-maintenance-brake-rear
      ExecutionRoleArn: !GetAtt FuriosaSageMakerExecutionRole.Arn
      PrimaryContainer:
        Image: !Sub '683313688378.dkr.ecr.${AWS::Region}.amazonaws.com/sagemaker-xgboost:1-0-1'
        ModelDataUrl: !Sub 's3://${S3BucketName}/ml/models/placeholder/brake-rear-model.tar.gz'
      VpcConfig:
        Subnets:
          - !Ref FuriosaPublicSubnetA
          - !Ref FuriosaPublicSubnetB
        SecurityGroupIds:
          - !Ref FuriosaSageMakerSecurityGroup

  FuriosaMaintenanceModelChain:
    Condition: CreateSageMakerResourcesCondition
    Type: AWS::SageMaker::Model
    Properties:
      ModelName: furiosa-maintenance-chain
      ExecutionRoleArn: !GetAtt FuriosaSageMakerExecutionRole.Arn
      PrimaryContainer:
        Image: !Sub '683313688378.dkr.ecr.${AWS::Region}.amazonaws.com/sagemaker-xgboost:1-0-1'
        ModelDataUrl: !Sub 's3://${S3BucketName}/ml/models/placeholder/chain-model.tar.gz'
      VpcConfig:
        Subnets:
          - !Ref FuriosaPublicSubnetA
          - !Ref FuriosaPublicSubnetB
        SecurityGroupIds:
          - !Ref FuriosaSageMakerSecurityGroup

  FuriosaMaintenanceModelTireFront:
    Condition: CreateSageMakerResourcesCondition
    Type: AWS::SageMaker::Model
    Properties:
      ModelName: furiosa-maintenance-tire-front
      ExecutionRoleArn: !GetAtt FuriosaSageMakerExecutionRole.Arn
      PrimaryContainer:
        Image: !Sub '683313688378.dkr.ecr.${AWS::Region}.amazonaws.com/sagemaker-xgboost:1-0-1'
        ModelDataUrl: !Sub 's3://${S3BucketName}/ml/models/placeholder/tire-front-model.tar.gz'
      VpcConfig:
        Subnets:
          - !Ref FuriosaPublicSubnetA
          - !Ref FuriosaPublicSubnetB
        SecurityGroupIds:
          - !Ref FuriosaSageMakerSecurityGroup

  FuriosaMaintenanceModelTireRear:
    Condition: CreateSageMakerResourcesCondition
    Type: AWS::SageMaker::Model
    Properties:
      ModelName: furiosa-maintenance-tire-rear
      ExecutionRoleArn: !GetAtt FuriosaSageMakerExecutionRole.Arn
      PrimaryContainer:
        Image: !Sub '683313688378.dkr.ecr.${AWS::Region}.amazonaws.com/sagemaker-xgboost:1-0-1'
        ModelDataUrl: !Sub 's3://${S3BucketName}/ml/models/placeholder/tire-rear-model.tar.gz'
      VpcConfig:
        Subnets:
          - !Ref FuriosaPublicSubnetA
          - !Ref FuriosaPublicSubnetB
        SecurityGroupIds:
          - !Ref FuriosaSageMakerSecurityGroup

  FuriosaMaintenanceModelUrgency:
    Condition: CreateSageMakerResourcesCondition
    Type: AWS::SageMaker::Model
    Properties:
      ModelName: furiosa-maintenance-urgency
      ExecutionRoleArn: !GetAtt FuriosaSageMakerExecutionRole.Arn
      PrimaryContainer:
        Image: !Sub '683313688378.dkr.ecr.${AWS::Region}.amazonaws.com/sagemaker-xgboost:1-0-1'
        ModelDataUrl: !Sub 's3://${S3BucketName}/ml/models/placeholder/urgency-model.tar.gz'
      VpcConfig:
        Subnets:
          - !Ref FuriosaPublicSubnetA
          - !Ref FuriosaPublicSubnetB
        SecurityGroupIds:
          - !Ref FuriosaSageMakerSecurityGroup

  FuriosaEndpointConfigOil:
    Condition: CreateSageMakerResourcesCondition
    Type: AWS::SageMaker::EndpointConfig
    Properties:
      ProductionVariants:
        - InitialInstanceCount: 1
          InitialVariantWeight: 1.0
          InstanceType: ml.m5.large
          ModelName: furiosa-maintenance-oil
          VariantName: AllTraffic

  FuriosaEndpointOil:
    Condition: CreateSageMakerResourcesCondition
    Type: AWS::SageMaker::Endpoint
    Properties:
      EndpointConfigName: !GetAtt FuriosaEndpointConfigOil.EndpointConfigName
      EndpointName: furiosa-maintenance-oil

  FuriosaEndpointConfigBrakeFront:
    Condition: CreateSageMakerResourcesCondition
    Type: AWS::SageMaker::EndpointConfig
    Properties:
      ProductionVariants:

name: Deploy AWS Lambdas

on:
  push:
    branches: [ "infra-cloud" ]
    paths:
      - 'aws-cloud/lambda/**'
      - '.github/workflows/deploy-lambda.yml'

permissions:
  id-token: write
  contents: read

jobs:
  detect-and-deploy:
    runs-on: ubuntu-latest
    outputs:
      changed_lambdas: ${{ steps.filter.outputs.changed_lambdas }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed Lambda files
        id: filter
        run: |
          # Obtener los archivos cambiados
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep 'aws-cloud/lambda/.*\.py' || true)
          
          # Extraer solo los nombres (sin ruta ni extensión)
          LAMBDAS=""
          for file in $CHANGED; do
            NAME=$(basename "$file" .py)
            LAMBDAS="$LAMBDAS\"$NAME\","
          done
          
          # Quitar la última coma y envolver en JSON array
          LAMBDAS="[${LAMBDAS%,}]"
          
          echo "changed_lambdas=$LAMBDAS" >> $GITHUB_OUTPUT
          echo "Cambios detectados: $LAMBDAS"

  deploy:
    needs: detect-and-deploy
    if: needs.detect-and-deploy.outputs.changed_lambdas != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lambda: ${{ fromJson(needs.detect-and-deploy.outputs.changed_lambdas) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Package Lambda
        run: |
          mkdir -p package
          cp aws-cloud/lambda/${{ matrix.lambda }}.py package/lambda_function.py
          if [ -f aws-cloud/lambda/requirements.txt ]; then
            pip install -r aws-cloud/lambda/requirements.txt -t package/
          fi
          cd package && zip -r ../lambda.zip . && cd ..

      - name: Deploy Lambda
        run: |
          FUNCTION_NAME="${{ matrix.lambda }}"
          if aws lambda get-function --function-name $FUNCTION_NAME --region us-east-1 2>/dev/null; then
            echo "✅ Actualizando función existente: $FUNCTION_NAME"
            aws lambda update-function-code \
              --function-name $FUNCTION_NAME \
              --zip-file fileb://lambda.zip \
              --region us-east-1
          else
            echo "⚠️ La función $FUNCTION_NAME no existe. Crea la función primero en AWS."
          fi